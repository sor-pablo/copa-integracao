<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa Integração – Rede Calábria</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1F3A;
    --teal: #2A7F8F;
    --teal-light: #3AABB D;
    --yellow: #F5E176;
    --yellow-soft: #FDF3A0;
    --gray-dark: #1A2F48;
    --gray-mid: #243D5A;
    --gray-light: #E8F4F8;
    --white: #F9FBFC;
  }

- { box-sizing: border-box; }

body {
font-family: ‘Barlow’, sans-serif;
background: #0B1F3A;
color: #E8F4F8;
min-height: 100vh;
}

h1, h2, h3, h4 {
font-family: ‘Barlow Condensed’, sans-serif;
}

/* HEADER */
.site-header {
background: linear-gradient(135deg, #071629 0%, #0B1F3A 50%, #0D2847 100%);
border-bottom: 3px solid #2A7F8F;
position: relative;
overflow: hidden;
}
.site-header::before {
content: ‘’;
position: absolute;
top: -50%;
right: -10%;
width: 400px;
height: 400px;
background: radial-gradient(circle, rgba(42,127,143,0.15) 0%, transparent 70%);
pointer-events: none;
}
.site-header::after {
content: ‘’;
position: absolute;
bottom: -20px;
left: 5%;
width: 200px;
height: 200px;
background: radial-gradient(circle, rgba(245,225,118,0.07) 0%, transparent 70%);
pointer-events: none;
}

.logo-badge {
width: 64px;
height: 64px;
background: linear-gradient(135deg, #2A7F8F, #1a5f6e);
border: 2px solid #F5E176;
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 28px;
font-weight: 900;
color: #F5E176;
letter-spacing: -1px;
flex-shrink: 0;
}

/* NAV TABS */
.sport-tab {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 15px;
font-weight: 700;
letter-spacing: 1px;
text-transform: uppercase;
padding: 10px 28px;
border-radius: 6px;
cursor: pointer;
transition: all 0.2s ease;
border: 2px solid transparent;
}
.sport-tab.active {
background: #2A7F8F;
color: #F5E176;
border-color: #2A7F8F;
}
.sport-tab:not(.active) {
background: transparent;
color: #8ABCC8;
border-color: #1A3A52;
}
.sport-tab:not(.active):hover {
border-color: #2A7F8F;
color: #E8F4F8;
}

/* SHIFT TABS */
.shift-tab {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 13px;
font-weight: 700;
letter-spacing: 1px;
text-transform: uppercase;
padding: 7px 20px;
border-radius: 4px;
cursor: pointer;
transition: all 0.2s ease;
border: 1px solid #1A3A52;
color: #6A9DB0;
}
.shift-tab.active {
background: rgba(245,225,118,0.12);
color: #F5E176;
border-color: rgba(245,225,118,0.4);
}
.shift-tab:not(.active):hover {
color: #E8F4F8;
border-color: #2A7F8F;
}

/* SECTION CARDS */
.section-card {
background: linear-gradient(135deg, #0F2640 0%, #0D2138 100%);
border: 1px solid #1A3A52;
border-radius: 12px;
overflow: hidden;
}
.section-header {
background: linear-gradient(90deg, #1A3A52, #112030);
border-bottom: 2px solid #2A7F8F;
padding: 14px 20px;
display: flex;
align-items: center;
gap: 10px;
}
.section-header h3 {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 16px;
font-weight: 800;
letter-spacing: 2px;
text-transform: uppercase;
color: #F5E176;
}
.section-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background: #2A7F8F;
flex-shrink: 0;
}

/* BRACKET */
/* Each match slot is MATCH_H px tall. Rounds are columns.
Round r has (totalSlots / 2^r) matches, each occupying 2^r slots.
We use absolute positioning inside a fixed-height column so
every match is perfectly centred between its two feeders.      */
:root { –match-h: 76px; –round-w: 172px; –conn-w: 28px; }

.bracket-container {
overflow-x: auto;
overflow-y: visible;
padding: 20px 20px 28px;
}
.bracket-grid {
display: flex;
align-items: flex-start;
gap: 0;
width: max-content;
}
/* One column per round */
.bracket-round {
display: flex;
flex-direction: column;
flex-shrink: 0;
width: var(–round-w);
}
.bracket-round-header {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 11px;
font-weight: 700;
letter-spacing: 2px;
text-transform: uppercase;
color: #5A8FA0;
text-align: center;
padding: 0 0 12px;
white-space: nowrap;
}
/* The column body: height = totalSlots × MATCH_H */
.bracket-col-body {
position: relative;
width: var(–round-w);
}
/* Each match card is absolutely positioned */
.bracket-slot {
position: absolute;
left: 0;
width: calc(var(–round-w) - var(–conn-w));
display: flex;
align-items: center;
}
.bracket-match {
background: #0F2640;
border: 1px solid #1E3F5C;
border-radius: 8px;
overflow: hidden;
width: 100%;
flex-shrink: 0;
transition: border-color 0.2s ease;
}
.bracket-match:hover { border-color: #2A7F8F; }
.bracket-team {
padding: 7px 10px;
font-size: 12px;
font-weight: 500;
display: flex;
justify-content: space-between;
align-items: center;
min-height: 32px;
border-bottom: 1px solid #1A3040;
gap: 4px;
}
.bracket-team:last-child { border-bottom: none; }
.bracket-team.winner {
background: rgba(42,127,143,0.2);
color: #F5E176;
font-weight: 700;
}
.bracket-team.loser  { color: #4A7A90; }
.bracket-team.tbd    { color: #2A5060; font-style: italic; }
.bracket-score {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 16px;
font-weight: 800;
color: #F5E176;
min-width: 20px;
text-align: center;
}
.bracket-score.tbd-score { color: #1E3F5C; }
/* Connector: horizontal line + two vertical stubs to feeders */
.bracket-conn {
position: absolute;
right: 0;
width: var(–conn-w);
pointer-events: none;
}

/* connector-right removed – SVG connectors used instead */

/* MATCH CARDS */
.match-card {
background: linear-gradient(135deg, #0D2138 0%, #091929 100%);
border: 1px solid #1A3A52;
border-radius: 10px;
padding: 14px 16px;
transition: border-color 0.2s ease, transform 0.15s ease;
}
.match-card:hover {
border-color: #2A7F8F;
transform: translateY(-1px);
}
.match-card.finished {
border-left: 3px solid #2A7F8F;
}
.match-card.upcoming {
border-left: 3px solid rgba(245,225,118,0.4);
}
.team-name {
font-size: 13px;
font-weight: 600;
flex: 1;
min-width: 0;
}
.team-score {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 24px;
font-weight: 900;
color: #F5E176;
min-width: 28px;
text-align: center;
}
.match-vs {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 11px;
font-weight: 700;
letter-spacing: 2px;
color: #3A6A7C;
text-align: center;
padding: 0 8px;
}
.winner-tag {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 9px;
font-weight: 800;
letter-spacing: 1.5px;
text-transform: uppercase;
background: rgba(42,127,143,0.25);
color: #7ACDD8;
padding: 2px 6px;
border-radius: 3px;
margin-left: 6px;
white-space: nowrap;
}
.round-badge {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 10px;
font-weight: 700;
letter-spacing: 2px;
text-transform: uppercase;
background: rgba(245,225,118,0.1);
color: #B8C87A;
padding: 2px 8px;
border-radius: 3px;
}

/* ADMIN */
.admin-overlay {
position: fixed;
inset: 0;
background: rgba(5,12,22,0.92);
z-index: 1000;
display: flex;
align-items: center;
justify-content: center;
backdrop-filter: blur(4px);
}
.admin-panel {
background: linear-gradient(135deg, #0F2640, #091929);
border: 1px solid #2A7F8F;
border-radius: 16px;
width: 100%;
max-width: 900px;
max-height: 90vh;
overflow-y: auto;
margin: 16px;
}
.admin-header {
background: linear-gradient(90deg, #1A3A52, #0F2640);
border-bottom: 2px solid #2A7F8F;
padding: 20px 24px;
display: flex;
align-items: center;
justify-content: space-between;
position: sticky;
top: 0;
z-index: 10;
}

.form-input {
background: #091929;
border: 1px solid #1A3A52;
border-radius: 6px;
padding: 8px 12px;
color: #E8F4F8;
font-family: ‘Barlow’, sans-serif;
font-size: 14px;
width: 100%;
transition: border-color 0.2s ease;
outline: none;
}
.form-input:focus {
border-color: #2A7F8F;
}
.form-input::placeholder {
color: #2A5060;
}
.form-label {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 11px;
font-weight: 700;
letter-spacing: 1.5px;
text-transform: uppercase;
color: #5A8FA0;
margin-bottom: 4px;
display: block;
}

.btn-primary {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 13px;
font-weight: 800;
letter-spacing: 1.5px;
text-transform: uppercase;
background: #2A7F8F;
color: #F5E176;
border: none;
border-radius: 6px;
padding: 10px 20px;
cursor: pointer;
transition: all 0.2s ease;
}
.btn-primary:hover {
background: #35A0B4;
}
.btn-yellow {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 13px;
font-weight: 800;
letter-spacing: 1.5px;
text-transform: uppercase;
background: rgba(245,225,118,0.15);
color: #F5E176;
border: 1px solid rgba(245,225,118,0.4);
border-radius: 6px;
padding: 10px 20px;
cursor: pointer;
transition: all 0.2s ease;
}
.btn-yellow:hover {
background: rgba(245,225,118,0.25);
}
.btn-danger {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 13px;
font-weight: 800;
letter-spacing: 1.5px;
text-transform: uppercase;
background: rgba(180,50,50,0.2);
color: #E87070;
border: 1px solid rgba(180,50,50,0.4);
border-radius: 6px;
padding: 10px 20px;
cursor: pointer;
transition: all 0.2s ease;
}
.btn-danger:hover {
background: rgba(180,50,50,0.35);
}
.btn-sm {
padding: 6px 14px;
font-size: 11px;
}

/* CARD INPUTS */
.card-input-group {
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
}
.card-input-label {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 9px;
font-weight: 800;
letter-spacing: 1.5px;
text-transform: uppercase;
}
.card-input {
width: 52px;
padding: 6px 0;
border-radius: 6px;
border: 2px solid transparent;
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 22px;
font-weight: 900;
text-align: center;
outline: none;
transition: border-color 0.2s ease, background 0.2s ease;
-moz-appearance: textfield;
}
.card-input::-webkit-outer-spin-button,
.card-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.card-input.yellow-input {
background: rgba(255,200,0,0.10);
border-color: rgba(255,200,0,0.35);
color: #FFC800;
}
.card-input.yellow-input:focus {
background: rgba(255,200,0,0.18);
border-color: rgba(255,200,0,0.7);
}
.card-input.red-input {
background: rgba(220,50,50,0.10);
border-color: rgba(220,50,50,0.35);
color: #E05050;
}
.card-input.red-input:focus {
background: rgba(220,50,50,0.18);
border-color: rgba(220,50,50,0.7);
}
.card-input.blue-input {
background: rgba(80,150,220,0.10);
border-color: rgba(80,150,220,0.35);
color: #5096DC;
}
.card-input.blue-input:focus {
background: rgba(80,150,220,0.18);
border-color: rgba(80,150,220,0.7);
}

/* SCORE INPUT */
.score-input {
background: #091929;
border: 1px solid #1A3A52;
border-radius: 6px;
padding: 6px 0;
color: #F5E176;
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 28px;
font-weight: 900;
width: 60px;
text-align: center;
outline: none;
transition: border-color 0.2s ease;
}
.score-input:focus { border-color: #2A7F8F; }

/* ADMIN GAME ROW */
.admin-game-row {
background: #091929;
border: 1px solid #1A3040;
border-radius: 8px;
padding: 14px;
margin-bottom: 10px;
transition: border-color 0.2s ease;
}
.admin-game-row:hover { border-color: #1E4060; }
.admin-game-row.finished-row {
opacity: 0.6;
border-style: dashed;
}

/* GROUP TABLE */
.group-table {
width: 100%;
border-collapse: separate;
border-spacing: 0;
}
.group-table th {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 10px;
font-weight: 700;
letter-spacing: 1.5px;
text-transform: uppercase;
color: #4A7A90;
padding: 8px 10px;
text-align: center;
background: #071520;
border-bottom: 1px solid #1A3040;
}
.group-table th:first-child { text-align: left; }
.group-table td {
padding: 10px 10px;
font-size: 13px;
border-bottom: 1px solid #0F2030;
text-align: center;
color: #8ABCC8;
}
.group-table td:first-child { text-align: left; color: #E8F4F8; font-weight: 600; }
.group-table tr:last-child td { border-bottom: none; }
.group-table tr.first-place td { background: rgba(42,127,143,0.1); }
.group-table tr.first-place td:first-child { color: #F5E176; }
.rank-badge {
display: inline-block;
width: 20px;
height: 20px;
border-radius: 4px;
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 12px;
font-weight: 900;
text-align: center;
line-height: 20px;
margin-right: 6px;
}
.rank-1 { background: rgba(245,225,118,0.2); color: #F5E176; }
.rank-other { background: rgba(26,58,82,0.5); color: #4A7A90; }

/* TOAST */
.toast {
position: fixed;
bottom: 24px;
right: 24px;
background: linear-gradient(135deg, #1A3A52, #0F2640);
border: 1px solid #2A7F8F;
border-radius: 10px;
padding: 14px 20px;
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 15px;
font-weight: 700;
color: #F5E176;
z-index: 9999;
transform: translateY(100px);
opacity: 0;
transition: all 0.3s ease;
max-width: 320px;
letter-spacing: 0.5px;
box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.toast.show {
transform: translateY(0);
opacity: 1;
}

/* CHAMPION BANNER */
.champion-banner {
background: linear-gradient(135deg, rgba(245,225,118,0.15), rgba(42,127,143,0.15));
border: 2px solid rgba(245,225,118,0.5);
border-radius: 12px;
padding: 20px 24px;
text-align: center;
position: relative;
overflow: hidden;
}
.champion-banner::before {
content: ‘’;
position: absolute;
inset: 0;
background: radial-gradient(ellipse at center, rgba(245,225,118,0.08) 0%, transparent 70%);
}
.champion-title {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 12px;
font-weight: 700;
letter-spacing: 3px;
text-transform: uppercase;
color: #8ABCC8;
margin-bottom: 4px;
}
.champion-name {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 28px;
font-weight: 900;
color: #F5E176;
letter-spacing: 1px;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #071520; }
::-webkit-scrollbar-thumb { background: #1A3A52; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #2A7F8F; }

/* ANIMATIONS */
@keyframes fadeInUp {
from { opacity: 0; transform: translateY(16px); }
to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeInUp 0.35s ease forwards; }

/* PASSWORD MODAL */
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(5,12,22,0.96);
z-index: 2000;
display: flex;
align-items: center;
justify-content: center;
backdrop-filter: blur(6px);
}
.modal-box {
background: linear-gradient(135deg, #0F2640, #091929);
border: 1px solid #2A7F8F;
border-radius: 16px;
padding: 32px;
width: 100%;
max-width: 380px;
margin: 16px;
}

/* CONNECTOR LINES FOR BRACKET */
.connector-h {
height: 2px;
background: #1A3A52;
width: 20px;
}
/* bracket-spacer removed */

.empty-state {
text-align: center;
padding: 40px 20px;
color: #2A5060;
}
.empty-state p {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 16px;
font-weight: 600;
letter-spacing: 1px;
text-transform: uppercase;
margin-top: 8px;
}

/* DIVIDER */
.divider {
height: 1px;
background: linear-gradient(90deg, transparent, #1A3A52, transparent);
margin: 20px 0;
}

/* STATUS BADGE */
.status-live {
display: inline-flex;
align-items: center;
gap: 4px;
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 10px;
font-weight: 700;
letter-spacing: 1.5px;
text-transform: uppercase;
color: #7ACDD8;
background: rgba(42,127,143,0.15);
padding: 2px 8px;
border-radius: 3px;
}
.dot-live {
width: 5px;
height: 5px;
border-radius: 50%;
background: #2A7F8F;
animation: pulse 1.5s infinite;
}
@keyframes pulse {
0%, 100% { opacity: 1; }
50% { opacity: 0.3; }
}

/* SET SCORES */
.set-score {
display: inline-flex;
gap: 4px;
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 11px;
font-weight: 700;
}
.set-item {
background: #091929;
border: 1px solid #1A3040;
border-radius: 3px;
padding: 2px 6px;
color: #5A8FA0;
}
.set-item.won { color: #F5E176; background: rgba(245,225,118,0.08); border-color: rgba(245,225,118,0.2); }

.admin-section-title {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 13px;
font-weight: 800;
letter-spacing: 2px;
text-transform: uppercase;
color: #5A8FA0;
border-bottom: 1px solid #1A3040;
padding-bottom: 8px;
margin-bottom: 12px;
}

/* VOLLEY SET INPUTS */
.set-row {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 8px;
}
.set-row-label {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 11px;
font-weight: 700;
letter-spacing: 1px;
color: #3A6A7C;
width: 50px;
flex-shrink: 0;
text-transform: uppercase;
}
.set-score-input {
background: #091929;
border: 1px solid #1A3A52;
border-radius: 5px;
padding: 5px 0;
color: #F5E176;
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 20px;
font-weight: 900;
width: 50px;
text-align: center;
outline: none;
transition: border-color 0.2s ease;
}
.set-score-input:focus { border-color: #2A7F8F; }
.set-vs-sep {
font-family: ‘Barlow Condensed’, sans-serif;
font-size: 11px;
color: #2A5060;
}
</style>

</head>
<body>

<!-- TOAST -->

<div id="toast" class="toast"></div>

<!-- PASSWORD MODAL -->

<div id="passwordModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#F5E176;letter-spacing:1px;margin-bottom:4px;">PAINEL ADMINISTRATIVO</h2>
    <p style="font-size:13px;color:#5A8FA0;margin-bottom:24px;">Copa Integração – Rede Calábria</p>
    <label class="form-label">SENHA DE ACESSO</label>
    <input type="password" id="adminPassInput" class="form-input" placeholder="••••••" style="margin-bottom:16px;" onkeydown="if(event.key==='Enter')checkAdminPass()">
    <div id="passError" style="color:#E07070;font-size:13px;margin-bottom:12px;display:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;">SENHA INCORRETA</div>
    <div style="display:flex;gap:10px;">
      <button class="btn-primary" style="flex:1" onclick="checkAdminPass()">ENTRAR</button>
      <button class="btn-danger" onclick="closePasswordModal()">CANCELAR</button>
    </div>
  </div>
</div>

<!-- ADMIN PANEL -->

<div id="adminPanel" class="admin-overlay" style="display:none">
  <div class="admin-panel">
    <div class="admin-header">
      <div>
        <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#F5E176;letter-spacing:1px;">PAINEL ADMINISTRATIVO</h2>
        <p style="font-size:12px;color:#5A8FA0;margin-top:1px;">Copa Integração – Rede Calábria</p>
      </div>

<script>
// ══════════════════════════════════════════════════════════════════
//  COPA INTEGRAÇÃO – REDE CALÁBRIA
//  JavaScript único e completo
//  Persistência via localStorage['dadosCopa']
// ══════════════════════════════════════════════════════════════════

// ─── 1. OBJETO ÚNICO DE ESTADO ────────────────────────────────────
let sistemaData = {
  futebol: { manha: null, tarde: null },
  volei:   { manha: null, tarde: null }
};

// Abas de navegação activas
let abaEsporte = 'futebol';
let abaTurno   = 'manha';
let abaAdmin   = 'futmanha';

// ─── 2. TIMES ─────────────────────────────────────────────────────
const TIMES = {
  futebol: {
    manha: ['Elite ADM','Real Confeiteiros','Sabor na Rede','Designer United','Codificando'],
    tarde:  ['Meia Boca Jr','Tempestade de Acucar','Real Marcenaria','Marceneiros de Madrid',
             'Meu Gastronomo Favorito','Athletic Adobe Juniors','Os Scripters']
  },
  volei: {
    manha: ['Comado ADM','Os Sem Receita','Sabor na Rede','Designer United','Codificando'],
    tarde:  ['Bloqueio do Excel','Fora da Curva','Fornadas de Ouro','Real Marcenaria',
             'Marceneiros de Madrid','Meu Gastronomo Favorito','Athletic Adobe Juniors','Os Scripters']
  }
};

// ──────────────────────────────────────────────────────────────────
//  3. PERSISTÊNCIA  (chave única: 'dadosCopa')
// ──────────────────────────────────────────────────────────────────
function salvarNoStorage() {
  try {
    localStorage.setItem('dadosCopa', JSON.stringify(sistemaData));
  } catch(e) {
    console.error('[dadosCopa] Erro ao salvar:', e);
  }
}

function carregarDoStorage() {
  try {
    const raw = localStorage.getItem('dadosCopa');
    if (raw) {
      const parsed = JSON.parse(raw);
      // Validação mínima: precisa ter as quatro competições
      if (parsed && typeof parsed === 'object' && parsed.futebol && parsed.volei) {
        sistemaData = parsed;
        return true;  // havia dados
      }
    }
  } catch(e) {
    console.error('[dadosCopa] Erro ao carregar:', e);
    localStorage.removeItem('dadosCopa');
  }
  return false;  // storage vazio ou corrompido
}

// ──────────────────────────────────────────────────────────────────
//  4. UTILITÁRIOS
// ──────────────────────────────────────────────────────────────────
function embaralhar(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function novoId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3200);
}

function getComp() {
  return sistemaData[abaEsporte][abaTurno];
}

// ──────────────────────────────────────────────────────────────────
//  5. CRIAÇÃO DE JOGO
// ──────────────────────────────────────────────────────────────────
function criarJogo(timeA, timeB, isVolei) {
  return {
    id: novoId(),
    timeA: timeA || null,
    timeB: timeB || null,
    golA: null, golB: null,
    finished: false,
    isBye: false,
    winner: null,
    cartoes: {
      A: { amarelo: 0, vermelho: 0, azul: 0 },
      B: { amarelo: 0, vermelho: 0, azul: 0 }
    },
    isVolei: !!isVolei,
    sets: isVolei ? [] : null
  };
}

// ──────────────────────────────────────────────────────────────────
//  6. GERAÇÃO DE CHAVES
// ──────────────────────────────────────────────────────────────────
function nomesRodadas(qtdJogos1aRodada) {
  const nomes = [];
  let n = qtdJogos1aRodada;
  while (n >= 1) {
    if      (n === 1) nomes.push('FINAL');
    else if (n === 2) nomes.push('SEMIFINAL');
    else if (n === 4) nomes.push('QUARTAS DE FINAL');
    else              nomes.push('OITAVAS DE FINAL');
    n = Math.floor(n / 2);
  }
  return nomes;
}

function gerarBracket(times, isVolei) {
  const embaralhados = embaralhar(times);
  let tamanho = 1;
  while (tamanho < embaralhados.length) tamanho *= 2;

  const lista = [...embaralhados];
  while (lista.length < tamanho) lista.push(null);

  // Rodada 1
  const r1 = [];
  for (let i = 0; i < tamanho; i += 2) {
    const j = criarJogo(lista[i], lista[i + 1], isVolei);
    if (j.timeA && !j.timeB) { j.finished = true; j.winner = j.timeA; j.golA = 1; j.golB = 0; j.isBye = true; }
    if (!j.timeA && j.timeB) { j.finished = true; j.winner = j.timeB; j.golA = 0; j.golB = 1; j.isBye = true; }
    r1.push(j);
  }

  const nomes  = nomesRodadas(tamanho / 2);
  const rodadas = [{ nome: nomes[0], jogos: r1 }];

  let prev = r1;
  for (let r = 1; r < Math.log2(tamanho); r++) {
    const cur = [];
    for (let i = 0; i < prev.length; i += 2) {
      const j = criarJogo(null, null, isVolei);
      if (prev[i]   && prev[i].finished)   j.timeA = prev[i].winner;
      if (prev[i+1] && prev[i+1].finished) j.timeB = prev[i+1].winner;
      cur.push(j);
    }
    rodadas.push({ nome: nomes[r], jogos: cur });
    prev = cur;
  }

  return { tipo: 'bracket', rodadas, campeo: null, isVolei };
}

function gerarGrupos(times) {
  const emb  = embaralhar(times);
  const meio = Math.ceil(emb.length / 2);
  const gA   = emb.slice(0, meio);
  const gB   = emb.slice(meio);

  function jogosGrupo(lista) {
    const arr = [];
    for (let i = 0; i < lista.length; i++)
      for (let j = i + 1; j < lista.length; j++)
        arr.push(criarJogo(lista[i], lista[j], true));
    return arr;
  }

  function tabela(lista) {
    return lista.map(t => ({ time: t, v: 0, d: 0, pts: 0 }));
  }

  return {
    tipo: 'grupos',
    grupos: {
      A: { times: gA, jogos: jogosGrupo(gA), tabela: tabela(gA) },
      B: { times: gB, jogos: jogosGrupo(gB), tabela: tabela(gB) }
    },
    final: criarJogo(null, null, true),
    campeo: null
  };
}

// ──────────────────────────────────────────────────────────────────
//  7. GERAR TODAS AS CHAVES (com confirmação se já existir)
// ──────────────────────────────────────────────────────────────────
function generateAllDraws() {
  const jaExiste = sistemaData.futebol.manha || sistemaData.futebol.tarde ||
                   sistemaData.volei.manha   || sistemaData.volei.tarde;

  if (jaExiste) {
    const ok = window.confirm(
      'Ja existem chaves geradas.\n\nDeseja SOBRESCREVER todos os dados e gerar novas chaves?\n\nEsta acao nao pode ser desfeita.'
    );
    if (!ok) return;
  }

  sistemaData.futebol.manha = gerarBracket(TIMES.futebol.manha, false);
  sistemaData.futebol.tarde = gerarBracket(TIMES.futebol.tarde, false);
  sistemaData.volei.manha   = gerarGrupos(TIMES.volei.manha);
  sistemaData.volei.tarde   = gerarBracket(TIMES.volei.tarde, true);

  salvarNoStorage();
  renderizarChaves();
  if (document.getElementById('adminPanel').style.display !== 'none') {
    renderAdminContent();
  }
  toast('CHAVES GERADAS E SALVAS COM SUCESSO');
}

// ──────────────────────────────────────────────────────────────────
//  8. BUSCA DE JOGO POR ID
// ──────────────────────────────────────────────────────────────────
function buscarJogoPorId(id) {
  for (const esporte of ['futebol', 'volei']) {
    for (const turno of ['manha', 'tarde']) {
      const comp = sistemaData[esporte][turno];
      if (!comp) continue;

      if (comp.tipo === 'bracket') {
        for (let ri = 0; ri < comp.rodadas.length; ri++) {
          const jogos = comp.rodadas[ri].jogos;
          for (let ji = 0; ji < jogos.length; ji++) {
            if (jogos[ji].id === id) {
              return { comp, jogo: jogos[ji], esporte, turno, ri, ji, ctx: 'bracket', grupo: null };
            }
          }
        }
      } else if (comp.tipo === 'grupos') {
        for (const g of ['A', 'B']) {
          const jogos = comp.grupos[g].jogos;
          for (let ji = 0; ji < jogos.length; ji++) {
            if (jogos[ji].id === id) {
              return { comp, jogo: jogos[ji], esporte, turno, ri: null, ji, ctx: 'grupo', grupo: g };
            }
          }
        }
        if (comp.final && comp.final.id === id) {
          return { comp, jogo: comp.final, esporte, turno, ri: null, ji: 0, ctx: 'final', grupo: null };
        }
      }
    }
  }
  return null;
}

// ──────────────────────────────────────────────────────────────────
//  9. AVANÇO DE BRACKET
// ──────────────────────────────────────────────────────────────────
function avancarBracket(comp, ri, ji) {
  const jogo = comp.rodadas[ri].jogos[ji];
  if (!jogo.winner) return;

  const prxRi = ri + 1;
  if (prxRi >= comp.rodadas.length) { comp.campeo = jogo.winner; return; }

  const prxJi  = Math.floor(ji / 2);
  const prximo = comp.rodadas[prxRi].jogos[prxJi];
  if (ji % 2 === 0) prximo.timeA = jogo.winner;
  else              prximo.timeB = jogo.winner;
}

function recalcTabela(grupo) {
  grupo.tabela.forEach(r => { r.v = 0; r.d = 0; r.pts = 0; });
  grupo.jogos.forEach(j => {
    if (!j.finished || !j.winner) return;
    const perdedor = j.winner === j.timeA ? j.timeB : j.timeA;
    const rW = grupo.tabela.find(r => r.time === j.winner);
    const rL = grupo.tabela.find(r => r.time === perdedor);
    if (rW) { rW.v++; rW.pts++; }
    if (rL) rL.d++;
  });
  grupo.tabela.sort((a, b) => b.pts - a.pts);
}

function propagarFinal(comp) {
  const todosA = comp.grupos.A.jogos.every(j => j.finished);
  const todosB = comp.grupos.B.jogos.every(j => j.finished);
  if (todosA) comp.final.timeA = comp.grupos.A.tabela[0].time;
  if (todosB) comp.final.timeB = comp.grupos.B.tabela[0].time;
}

// ──────────────────────────────────────────────────────────────────
//  10. FINALIZAR JOGO
// ──────────────────────────────────────────────────────────────────
function finalizeMatch(jogoId) {
  const encontrado = buscarJogoPorId(jogoId);
  if (!encontrado) { toast('Erro: jogo nao encontrado.'); return; }

  const { comp, jogo, ri, ji, ctx, grupo } = encontrado;
  if (jogo.finished) { toast('Este jogo ja foi finalizado.'); return; }

  // Ler cartões
  const lc = elId => Math.max(0, parseInt(document.getElementById(elId)?.value) || 0);
  jogo.cartoes = {
    A: { amarelo: lc('cAY_'+jogoId), vermelho: lc('cAR_'+jogoId), azul: lc('cAB_'+jogoId) },
    B: { amarelo: lc('cBY_'+jogoId), vermelho: lc('cBR_'+jogoId), azul: lc('cBB_'+jogoId) }
  };

  // Vôlei: ler sets
  if (jogo.isVolei) {
    const sets = [];
    let wA = 0, wB = 0;
    for (let s = 1; s <= 3; s++) {
      const elA = document.getElementById('s'+s+'a_'+jogoId);
      const elB = document.getElementById('s'+s+'b_'+jogoId);
      if (!elA || !elB || (elA.value === '' && elB.value === '')) continue;
      const a = parseInt(elA.value) || 0;
      const b = parseInt(elB.value) || 0;
      if (a > 15 || b > 15) { toast('Sets limitados a 15 pontos!'); return; }
      if (a === b)           { toast('Set '+s+' nao pode empatar!'); return; }
      sets.push({ a, b });
      if (a > b) wA++; else wB++;
    }
    if (sets.length === 0) { toast('Informe pelo menos um set!'); return; }
    if (wA === wB)         { toast('Resultado em sets nao pode empatar!'); return; }
    jogo.sets  = sets;
    jogo.golA  = wA;
    jogo.golB  = wB;
    jogo.winner = wA > wB ? jogo.timeA : jogo.timeB;

  // Futebol: ler placar
  } else {
    const elA = document.getElementById('gA_'+jogoId);
    const elB = document.getElementById('gB_'+jogoId);
    if (!elA || !elB || elA.value === '' || elB.value === '') {
      toast('Informe o placar!'); return;
    }
    const gA = parseInt(elA.value);
    const gB = parseInt(elB.value);
    if (isNaN(gA) || isNaN(gB)) { toast('Placar invalido!'); return; }
    if (gA === gB) { toast('Mata-mata nao pode terminar empatado!'); return; }
    jogo.golA   = gA;
    jogo.golB   = gB;
    jogo.winner = gA > gB ? jogo.timeA : jogo.timeB;
  }

  jogo.finished = true;

  // Avançar chave
  if (ctx === 'bracket') {
    avancarBracket(comp, ri, ji);
  } else if (ctx === 'grupo') {
    recalcTabela(comp.grupos[grupo]);
    propagarFinal(comp);
  } else if (ctx === 'final') {
    comp.campeo = jogo.winner;
  }

  salvarNoStorage();       // ← salva IMEDIATAMENTE
  renderizarChaves();      // ← atualiza vista pública
  if (document.getElementById('adminPanel').style.display !== 'none') {
    renderAdminContent();  // ← atualiza painel admin
  }
  toast('Jogo finalizado! Vencedor: ' + jogo.winner);
}

// ──────────────────────────────────────────────────────────────────
//  11. RENDERIZAÇÃO PÚBLICA  (id="mainContent" já existe no HTML)
// ──────────────────────────────────────────────────────────────────

/**
 * renderizarChaves()
 * Função principal de renderização.
 * Lê sistemaData (já carregado do localStorage pelo carregarDoStorage),
 * determina a competição activa pelas abas seleccionadas,
 * e preenche #mainContent com os confrontos visuais.
 * Chamada em: window.onload, após sorteio, após resultado, ao trocar abas.
 */
function renderizarChaves() {
  const comp      = getComp();
  const container = document.getElementById('mainContent');
  if (!container) return;

  // Sem dados → mensagem de espera
  if (!comp) {
    container.innerHTML = `
      <div class="empty-state">
        <div style="width:56px;height:56px;border-radius:12px;background:#1A3040;
                    margin:0 auto 12px;display:flex;align-items:center;justify-content:center;">
          <div style="width:24px;height:24px;border:2px solid #2A5060;border-radius:50%;"></div>
        </div>
        <p>Aguardando sorteio oficial...</p>
        <p style="font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;
                  color:#1A3A52;margin-top:6px;">
          Acesse o painel Admin para gerar as chaves
        </p>
      </div>`;
    return;
  }

  let html = '';

  // Banner de campeão
  if (comp.campeo) {
    html += `
      <div class="champion-banner" style="margin-bottom:20px;">
        <div class="champion-title">CAMPEA(O)</div>
        <div class="champion-name">${comp.campeo}</div>
      </div>`;
  }

  // Chave visual (bracket ou grupos)
  if (comp.tipo === 'bracket') {
    html += htmlBracket(comp);
  } else {
    html += htmlGrupos(comp);
  }

  // Seções de resultados e próximos jogos
  html += htmlResultados(comp);

  container.innerHTML = html;
}

// ── Bracket visual ──────────────────────────────────────────────
function htmlBracket(comp) {
  const MATCH_H = 76;
  const CONN_W  = 28;
  const CARD_H  = 64;

  const totalRodadas = comp.rodadas.length;
  const totalSlots   = comp.rodadas[0].jogos.length * 2;
  const alturaCol    = totalSlots * MATCH_H;

  let h = `
  <div class="section-card" style="margin-bottom:20px;">
    <div class="section-header">
      <div class="section-dot"></div>
      <h3>CHAVE – MATA-MATA</h3>
    </div>
    <div class="bracket-container">
      <div class="bracket-grid">`;

  comp.rodadas.forEach((rodada, ri) => {
    const qtdJogos   = rodada.jogos.length;
    const slotsJogo  = totalSlots / qtdJogos;   // slots que cada jogo ocupa
    const altGrupo   = slotsJogo * MATCH_H;
    const isUltima   = ri === totalRodadas - 1;

    h += `
        <div class="bracket-round">
          <div class="bracket-round-header">${rodada.nome}</div>
          <div class="bracket-col-body" style="height:${alturaCol}px;">`;

    rodada.jogos.forEach((jogo, ji) => {
      // Ocultar jogos de BYE puro (ambos os times null) – não devem aparecer
      if (!jogo.timeA && !jogo.timeB) return;

      const tA  = jogo.timeA || 'A DEFINIR';
      const tB  = jogo.timeB || 'A DEFINIR';
      const clA = jogo.finished
        ? (jogo.winner === jogo.timeA ? 'winner' : 'loser')
        : (!jogo.timeA ? 'tbd' : '');
      const clB = jogo.finished
        ? (jogo.winner === jogo.timeB ? 'winner' : 'loser')
        : (!jogo.timeB ? 'tbd' : '');
      const sA  = jogo.finished ? jogo.golA : (jogo.timeA ? '-' : '');
      const sB  = jogo.finished ? jogo.golB : (jogo.timeB ? '-' : '');

      // Posição vertical centrada no grupo
      const topPx = ji * altGrupo + (altGrupo / 2) - (CARD_H / 2);

      // Linha de sets (vôlei)
      let setLine = '';
      if (jogo.isVolei && jogo.sets && jogo.sets.length) {
        setLine = `<div style="font-size:10px;color:#3A6A7C;text-align:center;
                               padding:2px 0;font-family:'Barlow Condensed',sans-serif;">
                    ${jogo.sets.map(s => s.a + '-' + s.b).join(' | ')}
                   </div>`;
      }

      // Conector SVG para a próxima rodada
      let svg = '';
      if (!isUltima) {
        const irmaoTop = (ji ^ 1) * altGrupo + (altGrupo / 2) - (CARD_H / 2);
        const myMid    = topPx + CARD_H / 2;
        const sibMid   = irmaoTop + CARD_H / 2;
        const joinY    = (myMid + sibMid) / 2;
        const svgH     = Math.abs(joinY - myMid) + 2;
        const y1       = myMid <= joinY ? 1 : svgH - 1;
        const y2       = myMid <= joinY ? svgH - 1 : 1;
        svg = `<svg class="bracket-conn"
                 style="top:${Math.min(myMid,joinY)-1}px;height:${svgH}px;"
                 viewBox="0 0 ${CONN_W} ${svgH}" preserveAspectRatio="none">
                 <line x1="0" y1="${y1}" x2="0"        y2="${y2}" stroke="#1E3F5C" stroke-width="1.5"/>
                 <line x1="0" y1="${y2}" x2="${CONN_W}" y2="${y2}" stroke="#1E3F5C" stroke-width="1.5"/>
               </svg>`;
      }

      h += `
            <div class="bracket-slot" style="top:${topPx}px;">
              <div class="bracket-match">
                <div class="bracket-team ${clA}">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;flex:1;">${tA}</span>
                  <span class="bracket-score ${jogo.finished ? '' : 'tbd-score'}">${sA}</span>
                </div>
                ${setLine}
                <div class="bracket-team ${clB}">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;flex:1;">${tB}</span>
                  <span class="bracket-score ${jogo.finished ? '' : 'tbd-score'}">${sB}</span>
                </div>
              </div>
              ${svg}
            </div>`;
    });

    h += `
          </div>
        </div>`;
  });

  h += `
      </div>
    </div>
  </div>`;
  return h;
}

// ── Grupos (Vôlei Manhã) ─────────────────────────────────────────
function htmlGrupos(comp) {
  let h = '';
  ['A','B'].forEach(g => {
    const grupo = comp.grupos[g];
    h += `
    <div class="section-card" style="margin-bottom:16px;">
      <div class="section-header">
        <div class="section-dot"></div>
        <h3>GRUPO ${g}</h3>
      </div>
      <div style="overflow-x:auto;padding:12px 12px 8px;">
        <table class="group-table">
          <thead><tr>
            <th style="min-width:140px;">TIME</th>
            <th>V</th><th>D</th><th>PTS</th>
          </tr></thead>
          <tbody>`;
    grupo.tabela.forEach((r, i) => {
      h += `
            <tr class="${i === 0 ? 'first-place' : ''}">
              <td><span class="rank-badge ${i===0?'rank-1':'rank-other'}">${i+1}</span>${r.time}</td>
              <td>${r.v}</td><td>${r.d}</td>
              <td style="color:#F5E176;font-weight:700;">${r.pts}</td>
            </tr>`;
    });
    h += `
          </tbody>
        </table>
      </div>`;

    // Jogos já realizados no grupo
    const feitos = grupo.jogos.filter(j => j.finished);
    if (feitos.length) {
      h += `<div style="padding:0 12px 12px;">
              <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
                          letter-spacing:2px;color:#3A6070;text-transform:uppercase;margin-bottom:8px;">
                Jogos Realizados
              </div>`;
      feitos.forEach(j => { h += miniCard(j); });
      h += `</div>`;
    }
    h += `</div>`;
  });

  // Grande Final
  const todosDone = comp.grupos.A.jogos.every(j => j.finished) &&
                    comp.grupos.B.jogos.every(j => j.finished);
  h += `
  <div class="section-card" style="margin-bottom:20px;">
    <div class="section-header">
      <div class="section-dot" style="background:#F5E176;"></div>
      <h3 style="color:#F5E176;">GRANDE FINAL</h3>
    </div>
    <div style="padding:16px;">`;
  if (!todosDone) {
    h += `<p style="font-size:13px;color:#2A5060;text-align:center;
                     font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;">
            Aguardando conclusao dos grupos
          </p>`;
  } else {
    const f = { ...comp.final };
    if (!f.timeA) f.timeA = comp.grupos.A.tabela[0]?.time || 'Lider Grupo A';
    if (!f.timeB) f.timeB = comp.grupos.B.tabela[0]?.time || 'Lider Grupo B';
    h += miniCard(f);
  }
  h += `</div></div>`;
  return h;
}

// ── Mini card de resultado ────────────────────────────────────────
function miniCard(jogo) {
  const clA = jogo.finished ? (jogo.winner===jogo.timeA ? 'color:#F5E176;font-weight:700;' : 'color:#3A6A7C;') : '';
  const clB = jogo.finished ? (jogo.winner===jogo.timeB ? 'color:#F5E176;font-weight:700;' : 'color:#3A6A7C;') : '';
  let sets = '';
  if (jogo.isVolei && jogo.sets && jogo.sets.length) {
    sets = `<div class="set-score" style="margin:4px 0;">
              ${jogo.sets.map(s=>`<span class="set-item">${s.a}-${s.b}</span>`).join('')}
            </div>`;
  }
  return `
  <div class="match-card ${jogo.finished?'finished':'upcoming'}" style="margin-bottom:8px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="team-name" style="${clA}">${jogo.timeA||'A Definir'}</span>
      ${jogo.finished ? `<span class="team-score">${jogo.golA}</span>` : ''}
      <span class="match-vs">${jogo.finished?'X':'VS'}</span>
      ${jogo.finished ? `<span class="team-score">${jogo.golB}</span>` : ''}
      <span class="team-name" style="text-align:right;${clB}">${jogo.timeB||'A Definir'}</span>
    </div>
    ${sets}
  </div>`;
}

// ── Próximos jogos + Últimos resultados ──────────────────────────
function htmlResultados(comp) {
  let todos = [];
  if (comp.tipo === 'bracket') {
    comp.rodadas.forEach(r => r.jogos.forEach(j => todos.push({ jogo: j, nome: r.nome })));
  } else {
    ['A','B'].forEach(g =>
      comp.grupos[g].jogos.forEach(j => todos.push({ jogo: j, nome: 'Grupo '+g }))
    );
    todos.push({ jogo: comp.final, nome: 'Grande Final' });
  }

  // Filtrar BYEs e jogos sem times
  const reais    = todos.filter(x => x.jogo.timeA && x.jogo.timeB && !x.jogo.isBye);
  const feitos   = reais.filter(x => x.jogo.finished);
  const proximos = reais.filter(x => !x.jogo.finished);

  let h = '';

  // Próximos jogos
  if (proximos.length) {
    h += `
    <div class="section-card" style="margin-bottom:16px;">
      <div class="section-header">
        <div class="section-dot" style="background:#F5E176;opacity:.5;"></div>
        <h3>PROXIMOS JOGOS</h3>
      </div>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px;">`;
    proximos.slice(0, 6).forEach(({ jogo, nome }) => {
      h += `
        <div class="match-card upcoming">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
            <span class="round-badge">${nome}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="team-name">${jogo.timeA}</span>
            <span class="match-vs">VS</span>
            <span class="team-name" style="text-align:right;">${jogo.timeB}</span>
          </div>
        </div>`;
    });
    h += `</div></div>`;
  }

  // Últimos resultados
  if (feitos.length) {
    h += `
    <div class="section-card" style="margin-bottom:16px;">
      <div class="section-header">
        <div class="section-dot"></div>
        <h3>ULTIMOS RESULTADOS</h3>
      </div>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px;">`;
    [...feitos].reverse().slice(0, 8).forEach(({ jogo, nome }) => {
      const clA = jogo.winner===jogo.timeA ? 'color:#F5E176;font-weight:700;' : 'color:#3A6A7C;';
      const clB = jogo.winner===jogo.timeB ? 'color:#F5E176;font-weight:700;' : 'color:#3A6A7C;';

      // Cartões
      let cartoesHtml = '';
      if (jogo.cartoes) {
        const cA = jogo.cartoes.A, cB = jogo.cartoes.B;
        const total = cA.amarelo+cA.vermelho+cA.azul+cB.amarelo+cB.vermelho+cB.azul;
        if (total > 0) {
          const b = [];
          if (cA.amarelo+cB.amarelo)   b.push(`<span style="color:#FFC800;font-size:11px;font-weight:700;">${cA.amarelo+cB.amarelo} AM</span>`);
          if (cA.vermelho+cB.vermelho) b.push(`<span style="color:#E05050;font-size:11px;font-weight:700;">${cA.vermelho+cB.vermelho} VM</span>`);
          if (cA.azul+cB.azul)         b.push(`<span style="color:#5096DC;font-size:11px;font-weight:700;">${cA.azul+cB.azul} AZ</span>`);
          cartoesHtml = `<div style="display:flex;gap:6px;margin-top:6px;">${b.join('')}</div>`;
        }
      }

      // Sets vôlei
      let setsHtml = '';
      if (jogo.isVolei && jogo.sets && jogo.sets.length) {
        setsHtml = `<div style="display:flex;gap:4px;margin-top:6px;">
          ${jogo.sets.map(s => {
            const wA = s.a > s.b, wB = s.b > s.a;
            return `<span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;
                                 padding:2px 6px;border-radius:3px;
                                 background:#091929;border:1px solid #1A3040;color:#5A8FA0;">
                      <span style="${wA?'color:#F5E176;':''}">${s.a}</span>-<span style="${wB?'color:#F5E176;':''}">${s.b}</span>
                    </span>`;
          }).join('')}
        </div>`;
      }

      h += `
        <div class="match-card finished">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
            <span class="round-badge">${nome}</span>
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:#3A6070;
                         letter-spacing:1px;text-transform:uppercase;">Encerrado</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="team-name" style="${clA}">${jogo.timeA}</span>
            <span class="team-score">${jogo.golA}</span>
            <span class="match-vs">X</span>
            <span class="team-score">${jogo.golB}</span>
            <span class="team-name" style="text-align:right;${clB}">${jogo.timeB}</span>
          </div>
          ${setsHtml}${cartoesHtml}
        </div>`;
    });
    h += `</div></div>`;
  }

  return h;
}

// ──────────────────────────────────────────────────────────────────
//  12. PAINEL ADMIN – RENDERIZAÇÃO
// ──────────────────────────────────────────────────────────────────
function switchAdminTab(tab) {
  abaAdmin = tab;
  document.querySelectorAll('[id^="adminTab_"]').forEach(t => t.classList.remove('active'));
  document.getElementById('adminTab_'+tab).classList.add('active');
  renderAdminContent();
}

function renderAdminContent() {
  const map = {
    futmanha: { esporte:'futebol', turno:'manha', label:'Futebol – Turno Manha' },
    futtarde: { esporte:'futebol', turno:'tarde', label:'Futebol – Turno Tarde' },
    volmanha: { esporte:'volei',   turno:'manha', label:'Volei – Turno Manha'   },
    voltarde: { esporte:'volei',   turno:'tarde', label:'Volei – Turno Tarde'   }
  };
  const { esporte, turno, label } = map[abaAdmin];
  const comp = sistemaData[esporte][turno];
  const box  = document.getElementById('adminContent');

  if (!comp) {
    box.innerHTML = `
      <div style="text-align:center;padding:32px;color:#2A5060;">
        <p style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
                  letter-spacing:1px;text-transform:uppercase;">Chave nao gerada</p>
        <p style="font-size:13px;margin-top:4px;">Clique em "Sortear Todas as Chaves" acima</p>
      </div>`;
    return;
  }

  let h = `<div class="admin-section-title">${label}</div>`;

  if (comp.tipo === 'bracket') {
    comp.rodadas.forEach((rodada, ri) => {
      h += `<div style="margin-bottom:20px;">
              <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
                          letter-spacing:2px;color:#3A6070;text-transform:uppercase;margin-bottom:10px;">
                ${rodada.nome}
              </div>`;
      rodada.jogos.forEach(jogo => { h += rowAdmin(jogo); });
      h += `</div>`;
    });

  } else {
    ['A','B'].forEach(g => {
      h += `<div style="margin-bottom:20px;">
              <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
                          letter-spacing:2px;color:#3A6070;text-transform:uppercase;margin-bottom:10px;">
                GRUPO ${g}
              </div>`;
      comp.grupos[g].jogos.forEach(jogo => { h += rowAdmin(jogo); });
      h += `</div>`;
    });

    const todosDone = comp.grupos.A.jogos.every(j=>j.finished) &&
                      comp.grupos.B.jogos.every(j=>j.finished);
    h += `<div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
                        letter-spacing:2px;color:#F5E176;text-transform:uppercase;margin-bottom:10px;">
              GRANDE FINAL
            </div>`;
    if (!todosDone) {
      h += `<p style="font-size:12px;color:#2A5060;font-style:italic;">Aguardando conclusao dos grupos...</p>`;
    } else {
      // Sincronizar times da final com líderes
      if (!comp.final.timeA) comp.final.timeA = comp.grupos.A.tabela[0]?.time;
      if (!comp.final.timeB) comp.final.timeB = comp.grupos.B.tabela[0]?.time;
      h += rowAdmin(comp.final);
    }
    h += `</div>`;
  }

  box.innerHTML = h;
}

// ── Linha de jogo no Admin ────────────────────────────────────────
function rowAdmin(jogo) {
  if (!jogo.timeA || !jogo.timeB) {
    return `<div class="admin-game-row" style="opacity:.3;">
              <p style="font-size:12px;color:#2A5060;font-family:'Barlow Condensed',sans-serif;
                        letter-spacing:1px;text-transform:uppercase;">
                Aguardando definicao dos times...
              </p>
            </div>`;
  }

  const id = jogo.id;

  // Jogo já encerrado
  if (jogo.finished) {
    let setsLinha = '';
    if (jogo.isVolei && jogo.sets && jogo.sets.length) {
      setsLinha = `<span style="font-size:11px;color:#5A8FA0;margin-left:8px;">
                     ${jogo.sets.map(s => s.a+'-'+s.b).join(' | ')}
                   </span>`;
    }
    return `
    <div class="admin-game-row finished-row">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span style="font-size:13px;color:#3A6A7C;font-weight:600;">${jogo.timeA}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:#F5E176;">
          ${jogo.golA} – ${jogo.golB}
        </span>
        <span style="font-size:13px;color:#3A6A7C;font-weight:600;">${jogo.timeB}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:#2A7F8F;
                     letter-spacing:1px;text-transform:uppercase;margin-left:auto;">
          Vencedor: ${jogo.winner}
        </span>
      </div>
      ${setsLinha}
    </div>`;
  }

  // Placar ou Sets
  const cv = (time, tipo) => jogo.cartoes?.[time]?.[tipo] || 0;

  let entradaPlacar = '';
  if (jogo.isVolei) {
    let setInputs = '';
    for (let s = 1; s <= 3; s++) {
      setInputs += `
        <div class="set-row">
          <span class="set-row-label">SET ${s}</span>
          <input type="number" min="0" max="15" class="set-score-input" id="s${s}a_${id}" placeholder="0">
          <span class="set-vs-sep">–</span>
          <input type="number" min="0" max="15" class="set-score-input" id="s${s}b_${id}" placeholder="0">
        </div>`;
    }
    entradaPlacar = `<div>
                       <div class="form-label" style="margin-bottom:8px;">SETS (MAX 15 PTS)</div>
                       ${setInputs}
                     </div>`;
  } else {
    entradaPlacar = `
      <div>
        <div class="form-label" style="margin-bottom:4px;">${jogo.timeA}</div>
        <input type="number" min="0" class="score-input" id="gA_${id}" placeholder="0">
      </div>
      <div style="padding-bottom:12px;">
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:20px;color:#2A5060;font-weight:700;">–</span>
      </div>
      <div>
        <div class="form-label" style="margin-bottom:4px;">${jogo.timeB}</div>
        <input type="number" min="0" class="score-input" id="gB_${id}" placeholder="0">
      </div>`;
  }

  return `
  <div class="admin-game-row" id="row_${id}">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
      <span style="font-size:13px;color:#E8F4F8;font-weight:700;">${jogo.timeA}</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:12px;color:#2A5060;letter-spacing:2px;">VS</span>
      <span style="font-size:13px;color:#E8F4F8;font-weight:700;">${jogo.timeB}</span>
    </div>

    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
      ${entradaPlacar}

      <div style="margin-left:auto;min-width:220px;">
        <div class="form-label" style="margin-bottom:8px;">CARTOES – ${jogo.timeA}</div>
        <div style="display:flex;gap:10px;margin-bottom:14px;">
          <div class="card-input-group">
            <input type="number" min="0" class="card-input yellow-input" id="cAY_${id}" value="${cv('A','amarelo')}">
            <span class="card-input-label" style="color:#FFC800;">AMARELO</span>
          </div>
          <div class="card-input-group">
            <input type="number" min="0" class="card-input red-input"    id="cAR_${id}" value="${cv('A','vermelho')}">
            <span class="card-input-label" style="color:#E05050;">VERMELHO</span>
          </div>
          <div class="card-input-group">
            <input type="number" min="0" class="card-input blue-input"   id="cAB_${id}" value="${cv('A','azul')}">
            <span class="card-input-label" style="color:#5096DC;">AZUL</span>
          </div>
        </div>

        <div class="form-label" style="margin-bottom:8px;">CARTOES – ${jogo.timeB}</div>
        <div style="display:flex;gap:10px;">
          <div class="card-input-group">
            <input type="number" min="0" class="card-input yellow-input" id="cBY_${id}" value="${cv('B','amarelo')}">
            <span class="card-input-label" style="color:#FFC800;">AMARELO</span>
          </div>
          <div class="card-input-group">
            <input type="number" min="0" class="card-input red-input"    id="cBR_${id}" value="${cv('B','vermelho')}">
            <span class="card-input-label" style="color:#E05050;">VERMELHO</span>
          </div>
          <div class="card-input-group">
            <input type="number" min="0" class="card-input blue-input"   id="cBB_${id}" value="${cv('B','azul')}">
            <span class="card-input-label" style="color:#5096DC;">AZUL</span>
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top:14px;padding-top:14px;border-top:1px solid #1A3040;">
      <button class="btn-primary" onclick="finalizeMatch('${id}')">FINALIZAR JOGO</button>
    </div>
  </div>`;
}

// ──────────────────────────────────────────────────────────────────
//  13. NAVEGAÇÃO
// ──────────────────────────────────────────────────────────────────
function switchSport(esporte) {
  abaEsporte = esporte;
  document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sportTab_'+esporte).classList.add('active');
  renderizarChaves();
}
function switchShift(turno) {
  abaTurno = turno;
  document.querySelectorAll('.shift-tab[id^="shiftTab"]').forEach(t => t.classList.remove('active'));
  document.getElementById('shiftTab_'+turno).classList.add('active');
  renderizarChaves();
}

// ──────────────────────────────────────────────────────────────────
//  14. ADMIN – AUTENTICAÇÃO
// ──────────────────────────────────────────────────────────────────
function openPasswordModal() {
  document.getElementById('passwordModal').style.display = 'flex';
  setTimeout(() => document.getElementById('adminPassInput').focus(), 100);
}
function closePasswordModal() {
  document.getElementById('passwordModal').style.display = 'none';
  document.getElementById('adminPassInput').value = '';
  document.getElementById('passError').style.display = 'none';
}
function checkAdminPass() {
  if (document.getElementById('adminPassInput').value === '246800') {
    closePasswordModal();
    document.getElementById('adminPanel').style.display = 'flex';
    renderAdminContent();
  } else {
    document.getElementById('passError').style.display = 'block';
    document.getElementById('adminPassInput').value = '';
    document.getElementById('adminPassInput').focus();
  }
}
function closeAdmin() {
  document.getElementById('adminPanel').style.display = 'none';
  renderizarChaves();
}

// ──────────────────────────────────────────────────────────────────
//  15. RESET COMPLETO
// ──────────────────────────────────────────────────────────────────
function resetAll() {
  if (!window.confirm('ATENCAO!\n\nEsta acao vai APAGAR todos os dados da copa: sorteios, placares e cartoes.\n\nDeseja continuar?')) return;
  localStorage.removeItem('dadosCopa');
  location.reload();
}

// ──────────────────────────────────────────────────────────────────
//  16. INICIALIZAÇÃO  (window.onload garante DOM pronto)
// ──────────────────────────────────────────────────────────────────
window.onload = function () {
  const haviadados = carregarDoStorage();   // preenche sistemaData
  renderizarChaves();                        // desenha as chaves (ou mensagem vazia)
  if (haviadados) {
    // Não faz nada extra – renderizarChaves já mostrou os dados
  }
};
</script>
