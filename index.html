<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#0B1F3A;color:#E8F4F8;min-height:100vh}
h1,h2,h3,h4{font-family:'Barlow Condensed',sans-serif}

/* ── HEADER ── */
.site-header{background:linear-gradient(135deg,#071629,#0B1F3A,#0D2847);border-bottom:3px solid #2A7F8F;position:relative;overflow:hidden}
.site-header::before{content:’’;position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(42,127,143,.15),transparent 70%);pointer-events:none}
.logo-badge{width:56px;height:56px;background:linear-gradient(135deg,#2A7F8F,#1a5f6e);border:2px solid #F5E176;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:‘Barlow Condensed’,sans-serif;font-size:24px;font-weight:900;color:#F5E176;flex-shrink:0}

/* ── TABS ── */
.sport-tab{font-family:‘Barlow Condensed’,sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:9px 22px;border-radius:6px;cursor:pointer;transition:all .2s;border:2px solid #1A3A52;background:transparent;color:#8ABCC8}
.sport-tab.active{background:#2A7F8F;color:#F5E176;border-color:#2A7F8F}
.sport-tab:hover:not(.active){border-color:#2A7F8F;color:#E8F4F8}
.shift-tab{font-family:‘Barlow Condensed’,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 18px;border-radius:4px;cursor:pointer;transition:all .2s;border:1px solid #1A3A52;background:transparent;color:#6A9DB0}
.shift-tab.active{background:rgba(245,225,118,.12);color:#F5E176;border-color:rgba(245,225,118,.4)}
.shift-tab:hover:not(.active){color:#E8F4F8;border-color:#2A7F8F}

/* ── CARDS ── */
.section-card{background:linear-gradient(135deg,#0F2640,#0D2138);border:1px solid #1A3A52;border-radius:12px;overflow:hidden;margin-bottom:16px}
.section-header{background:linear-gradient(90deg,#1A3A52,#112030);border-bottom:2px solid #2A7F8F;padding:13px 18px;display:flex;align-items:center;gap:10px}
.section-header h3{font-family:‘Barlow Condensed’,sans-serif;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#F5E176}
.section-dot{width:8px;height:8px;border-radius:50%;background:#2A7F8F;flex-shrink:0}

/* ── MATCH CARDS ── */
.match-card{background:linear-gradient(135deg,#0D2138,#091929);border:1px solid #1A3A52;border-radius:9px;padding:13px 15px;transition:border-color .2s,transform .15s;margin-bottom:8px}
.match-card:hover{border-color:#2A7F8F;transform:translateY(-1px)}
.match-card.finished{border-left:3px solid #2A7F8F}
.match-card.upcoming{border-left:3px solid rgba(245,225,118,.4)}
.team-name{font-size:13px;font-weight:600;flex:1;min-width:0}
.team-score{font-family:‘Barlow Condensed’,sans-serif;font-size:24px;font-weight:900;color:#F5E176;min-width:26px;text-align:center}
.match-vs{font-family:‘Barlow Condensed’,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;color:#3A6A7C;padding:0 6px}
.round-badge{font-family:‘Barlow Condensed’,sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:rgba(245,225,118,.1);color:#B8C87A;padding:2px 7px;border-radius:3px}

/* ── TABELA DE GRUPOS ── */
.group-table{width:100%;border-collapse:separate;border-spacing:0}
.group-table th{font-family:‘Barlow Condensed’,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#4A7A90;padding:8px 8px;text-align:center;background:#071520;border-bottom:1px solid #1A3040}
.group-table th:first-child{text-align:left}
.group-table td{padding:9px 8px;font-size:13px;border-bottom:1px solid #0F2030;text-align:center;color:#8ABCC8}
.group-table td:first-child{text-align:left;color:#E8F4F8;font-weight:600}
.group-table tr:last-child td{border-bottom:none}
.group-table tr.first-place td{background:rgba(42,127,143,.12)}
.group-table tr.first-place td:first-child{color:#F5E176}
.group-table tr.second-place td{background:rgba(42,127,143,.05)}
.group-table tr.second-place td:first-child{color:#8ABCC8}
.rank-badge{display:inline-block;width:20px;height:20px;border-radius:4px;font-family:‘Barlow Condensed’,sans-serif;font-size:12px;font-weight:900;text-align:center;line-height:20px;margin-right:6px}
.rank-1{background:rgba(245,225,118,.2);color:#F5E176}
.rank-2{background:rgba(138,188,200,.15);color:#8ABCC8}
.rank-other{background:rgba(26,58,82,.5);color:#4A7A90}

/* ── BRACKET ── */
:root{–bw:164px;–cw:26px;–mh:72px}
.bracket-container{overflow-x:auto;padding:18px 18px 24px}
.bracket-grid{display:flex;width:max-content}
.bracket-round{display:flex;flex-direction:column;flex-shrink:0;width:var(–bw)}
.bracket-round-header{font-family:‘Barlow Condensed’,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#5A8FA0;text-align:center;padding:0 0 10px;white-space:nowrap}
.bracket-col-body{position:relative;width:var(–bw)}
.bracket-slot{position:absolute;left:0;width:calc(var(–bw) - var(–cw));display:flex;align-items:center}
.bracket-match{background:#0F2640;border:1px solid #1E3F5C;border-radius:7px;overflow:hidden;width:100%;transition:border-color .2s}
.bracket-match:hover{border-color:#2A7F8F}
.bracket-team{padding:6px 9px;font-size:11px;font-weight:500;display:flex;justify-content:space-between;align-items:center;min-height:30px;border-bottom:1px solid #1A3040;gap:4px}
.bracket-team:last-child{border-bottom:none}
.bracket-team.winner{background:rgba(42,127,143,.2);color:#F5E176;font-weight:700}
.bracket-team.loser{color:#4A7A90}
.bracket-team.tbd{color:#2A5060;font-style:italic}
.bracket-score{font-family:‘Barlow Condensed’,sans-serif;font-size:15px;font-weight:800;color:#F5E176;min-width:18px;text-align:center}
.bracket-score.tbd-score{color:#1E3F5C}
.bracket-conn{position:absolute;right:0;width:var(–cw);pointer-events:none}

.admin-header{background:linear-gradient(90deg,#1A3A52,#0F2640);border-bottom:2px solid #2A7F8F;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.admin-game-row{background:#091929;border:1px solid #1A3040;border-radius:8px;padding:13px;margin-bottom:9px;transition:border-color .2s}

.admin-section-title{font-family:‘Barlow Condensed’,sans-serif;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#5A8FA0;border-bottom:1px solid #1A3040;padding-bottom:7px;margin-bottom:11px}
.form-label{font-family:‘Barlow Condensed’,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#5A8FA0;margin-bottom:4px;display:block}

/* ── BOTÕES ── */
.btn-primary{font-family:‘Barlow Condensed’,sans-serif;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;background:#2A7F8F;color:#F5E176;border:none;border-radius:6px;padding:9px 18px;cursor:pointer;transition:background .2s}

.btn-yellow{font-family:‘Barlow Condensed’,sans-serif;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;background:rgba(245,225,118,.15);color:#F5E176;border:1px solid rgba(245,225,118,.4);border-radius:6px;padding:9px 18px;cursor:pointer;transition:background .2s}
.btn-yellow:hover{background:rgba(245,225,118,.25)}
.btn-danger{font-family:‘Barlow Condensed’,sans-serif;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;background:rgba(180,50,50,.2);color:#E87070;border:1px solid rgba(180,50,50,.4);border-radius:6px;padding:9px 18px;cursor:pointer;transition:background .2s}
.btn-danger:hover{background:rgba(180,50,50,.35)}
.btn-save{font-family:‘Barlow Condensed’,sans-serif;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;background:rgba(42,200,100,.15);color:#50E8A0;border:1px solid rgba(42,200,100,.4);border-radius:6px;padding:9px 18px;cursor:pointer;transition:background .2s}

.score-input{background:#091929;border:1px solid #1A3A52;border-radius:6px;padding:5px 0;color:#F5E176;font-family:‘Barlow Condensed’,sans-serif;font-size:26px;font-weight:900;width:58px;text-align:center;outline:none;transition:border-color .2s}

.card-input-group{display:flex;flex-direction:column;align-items:center;gap:4px}
.card-input-label{font-family:‘Barlow Condensed’,sans-serif;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.card-input{width:50px;padding:5px 0;border-radius:6px;border:2px solid transparent;font-family:‘Barlow Condensed’,sans-serif;font-size:20px;font-weight:900;text-align:center;outline:none;transition:all .2s;-moz-appearance:textfield}
.card-input::-webkit-outer-spin-button,.card-input::-webkit-inner-spin-button{-webkit-appearance:none}
.card-input.yi{background:rgba(255,200,0,.1);border-color:rgba(255,200,0,.35);color:#FFC800}
.card-input.yi:focus{background:rgba(255,200,0,.18);border-color:rgba(255,200,0,.7)}
.card-input.ri{background:rgba(220,50,50,.1);border-color:rgba(220,50,50,.35);color:#E05050}
.card-input.ri:focus{background:rgba(220,50,50,.18);border-color:rgba(220,50,50,.7)}
.card-input.bi{background:rgba(80,150,220,.1);border-color:rgba(80,150,220,.35);color:#5096DC}
.card-input.bi:focus{background:rgba(80,150,220,.18);border-color:rgba(80,150,220,.7)}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.set-row-label{font-family:‘Barlow Condensed’,sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:#3A6A7C;width:46px;flex-shrink:0;text-transform:uppercase}
.set-score-input{background:#091929;border:1px solid #1A3A52;border-radius:5px;padding:4px 0;color:#F5E176;font-family:‘Barlow Condensed’,sans-serif;font-size:18px;font-weight:900;width:46px;text-align:center;outline:none;transition:border-color .2s}
.set-score-input:focus{border-color:#2A7F8F}

/* ── MODAL SENHA ── */
.modal-overlay{position:fixed;inset:0;background:rgba(5,12,22,.97);z-index:2000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-box{background:linear-gradient(135deg,#0F2640,#091929);border:1px solid #2A7F8F;border-radius:14px;padding:30px;width:100%;max-width:370px;margin:14px}
.form-input{background:#091929;border:1px solid #1A3A52;border-radius:6px;padding:8px 11px;color:#E8F4F8;font-family:‘Barlow’,sans-serif;font-size:14px;width:100%;outline:none;transition:border-color .2s}
.form-input:focus{border-color:#2A7F8F}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:linear-gradient(135deg,#1A3A52,#0F2640);border:1px solid #2A7F8F;border-radius:9px;padding:13px 18px;font-family:‘Barlow Condensed’,sans-serif;font-size:14px;font-weight:700;color:#F5E176;z-index:9999;transform:translateY(100px);opacity:0;transition:all .3s;max-width:300px;letter-spacing:.5px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.show{transform:translateY(0);opacity:1}

/* ── CAMPEÃO ── */
.champion-banner{background:linear-gradient(135deg,rgba(245,225,118,.15),rgba(42,127,143,.15));border:2px solid rgba(245,225,118,.5);border-radius:12px;padding:20px 22px;text-align:center;margin-bottom:20px}
.champion-title{font-family:‘Barlow Condensed’,sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#8ABCC8;margin-bottom:4px}
.champion-name{font-family:‘Barlow Condensed’,sans-serif;font-size:28px;font-weight:900;color:#F5E176;letter-spacing:1px}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:40px 20px;color:#2A5060}
.empty-state p{font-family:‘Barlow Condensed’,sans-serif;font-size:15px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:8px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#071520}
::-webkit-scrollbar-thumb{background:#1A3A52;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#2A7F8F}

/* ── ANIMATIONS ── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── BANNER ANULAÇÃO ── */
.banner-anulado{background:linear-gradient(135deg,#7B0000,#B00000);border:2px solid #FF4444;border-radius:10px;padding:16px 20px;text-align:center;margin-bottom:18px;position:sticky;top:48px;z-index:90;box-shadow:0 4px 24px rgba(200,0,0,.4)}

</style>

</head>

async function apiSalvar(manual) {
  // Salva SEMPRE no localStorage primeiro (instantâneo, nunca falha)
  try { localStorage.setItem('copa_bkp', JSON.stringify(D)); } catch(e) {}

  if (saving) { if(manual) toast('Aguarde...'); return; }
  saving = true;
  const _t = setTimeout(() => { saving = false; }, 10000);
  setSync('salvando');

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    const r = await fetch(JWRITE, {
      method: 'PUT',
      headers: {
        'Content-Type':    'application/json',
        'X-Master-Key':    JKEY,
        'X-Bin-Versioning':'false'
      },
      body: JSON.stringify(D),
      signal: controller.signal
    });
    clearTimeout(timer);

    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      console.error('[Copa] PUT falhou', r.status, txt);
      throw new Error('HTTP ' + r.status);
    }
    console.log('[Copa] Salvo na nuvem OK');
    setSync('ok');
    if (manual) toast('Salvo no servidor!');
  } catch(e) {
    console.warn('[Copa] Nuvem indisponível ao salvar (' + e.message + '). Dados guardados localmente.');
    setSync('erro');
    if (manual) toast('Salvo localmente (nuvem indisponível).');
  } finally {
    clearTimeout(_t);
    saving = false;
  }
}

async function apiCarregar() {
  setSync('carregando');

  // 1. Tenta carregar do localStorage imediatamente (não bloqueia)
  try {
    const raw = localStorage.getItem('copa_bkp');
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.futebol && p.volei) {
        D = p;
        console.log('[Copa] Dados carregados do backup local');
      }
    }
  } catch(e) {}

  // 2. Tenta a nuvem com timeout de 8s
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    const r = await fetch(JREAD, {
      headers: { 'X-Master-Key': JKEY },
      signal: controller.signal
    });
    clearTimeout(timer);

    if (r.status === 404) { setSync('ok'); return false; }
    if (!r.ok) throw new Error('HTTP ' + r.status);

    const json = await r.json();
    const rec  = json?.record; // JSONBin v3 encapsula em .record
    if (rec && rec.futebol && rec.volei) {
      D = rec;
      try { localStorage.setItem('copa_bkp', JSON.stringify(D)); } catch(e) {}
      console.log('[Copa] Sincronizado com a nuvem');
      setSync('ok');
      return true;
    }
    setSync('ok');
    return false;
  } catch(e) {
    // Erro de rede (Load failed, timeout, CORS) – não é crítico
    // Os dados do localStorage já foram carregados acima
    console.warn('[Copa] Nuvem indisponível (' + e.message + '). Usando dados locais.');
    // Mostra conectado se tiver dados locais, erro só se não tiver nada
    const temDados = D.futebol.manha || D.futebol.tarde || D.volei.manha || D.volei.tarde;
    setSync(temDados ? 'ok' : 'erro');
    return false;
  }
}

// ── PONTOS CORRIDOS – recálculo de tabela ─────────────────────────
function recalcPC(comp) {
  // Garante que as estruturas C1/C2 existem (podem ter sumido após JSON.parse)
  if (!comp.C1 || !comp.C1.tab) {
    const base = mkFutTarde();
    comp.C1 = comp.C1 || base.C1;
    comp.C2 = comp.C2 || base.C2;
  }
  // Reinicia contadores
  ['C1','C2'].forEach(ck => {
    if (!comp[ck] || !comp[ck].tab) return;
    comp[ck].tab.forEach(r=>{ r.j=0;r.v=0;r.e=0;r.d=0;r.gp=0;r.gc=0;r.sg=0;r.pts=0; });
  });
  comp.jogos.forEach(jogo => {
    if (!jogo.finished || jogo.isFinal) return;
    const tab = comp[jogo.chave].tab;
    const rA = tab.find(r=>r.time===jogo.timeA);
    const rB = tab.find(r=>r.time===jogo.timeB);
    if (!rA||!rB) return;
    rA.j++; rB.j++;
    rA.gp+=(jogo.golA||0); rA.gc+=(jogo.golB||0);
    rB.gp+=(jogo.golB||0); rB.gc+=(jogo.golA||0);
    rA.sg=rA.gp-rA.gc;     rB.sg=rB.gp-rB.gc;
    if (jogo.empate) {
      rA.e++; rB.e++; rA.pts+=1; rB.pts+=1;
    } else if (jogo.winner===jogo.timeA) {
      rA.v++; rB.d++; rA.pts+=3;
    } else {
      rB.v++; rA.d++; rB.pts+=3;
    }
  });
  ['C1','C2'].forEach(ck => {
    comp[ck].tab.sort((a,b)=>b.pts-a.pts||b.sg-a.sg||b.gp-a.gp||a.time.localeCompare(b.time));
  });
  const d1=comp.jogos.filter(j=>j.chave==='C1').every(j=>j.finished);
  const d2=comp.jogos.filter(j=>j.chave==='C2').every(j=>j.finished);
  if (d1) { comp.final.timeA=comp.C1.tab[0]?.time||null; comp.terceiro.timeA=comp.C1.tab[1]?.time||null; }
  if (d2) { comp.final.timeB=comp.C2.tab[0]?.time||null; comp.terceiro.timeB=comp.C2.tab[1]?.time||null; }
}

// ── BUSCA DE JOGO POR ID ───────────────────────────────────────────
function findJ(id) {
  for (const sp of ['futebol','volei']) {
    for (const tr of ['manha','tarde']) {
      const c = D[sp][tr];
      if (!c) continue;
      if (c.tipo==='bracket') {
        for (let ri=0;ri<c.rodadas.length;ri++) {
          for (let ji=0;ji<c.rodadas[ri].jogos.length;ji++) {
            if (c.rodadas[ri].jogos[ji].id===id)
              return {comp:c,jogo:c.rodadas[ri].jogos[ji],ri,ji,ctx:'bracket'};
          }
        }
      }
      if (c.tipo==='pontoscorridos') {
        for (const j of c.jogos) if(j.id===id) return {comp:c,jogo:j,ctx:'pc'};
        if (c.terceiro?.id===id) return {comp:c,jogo:c.terceiro,ctx:'pcfinal'};
        if (c.final?.id===id)    return {comp:c,jogo:c.final,ctx:'pcfinal'};
      }
      if (c.tipo==='grupos') {
        for (const g of ['A','B']) {
          for (let ji=0;ji<c.grupos[g].jogos.length;ji++) {
            if (c.grupos[g].jogos[ji].id===id)
              return {comp:c,jogo:c.grupos[g].jogos[ji],ri:null,ji,ctx:'grupo',grupo:g};
          }
        }
        if (c.final?.id===id) return {comp:c,jogo:c.final,ctx:'gfinal'};
      }
    }
  }
  return null;
}

// ══════════════════════════════════════════════════════════════════
//  FINALIZAR JOGO
// ══════════════════════════════════════════════════════════════════
async function finalizeMatch(id) {
  const f = findJ(id);
  if (!f) { toast('Jogo não encontrado.'); return; }
  if (f.jogo.finished) { toast('Este jogo já foi finalizado.'); return; }
  const {comp,jogo,ri,ji,ctx,grupo} = f;

  // Cartões
  const lc = k => Math.max(0, parseInt(document.getElementById(k)?.value)||0);
  jogo.cartoes = {
    A:{am:lc('cAY_'+id),vm:lc('cAR_'+id),az:lc('cAB_'+id)},
    B:{am:lc('cBY_'+id),vm:lc('cBR_'+id),az:lc('cBB_'+id)}
  };

  // Placar
  if (jogo.isVolei) {
    const sets=[]; let wA=0,wB=0;
    for (let s=1;s<=3;s++) {
      const eA=document.getElementById(`s${s}a_${id}`), eB=document.getElementById(`s${s}b_${id}`);
      if (!eA||!eB||(eA.value===''&&eB.value==='')) continue;
      const a=parseInt(eA.value)||0, b=parseInt(eB.value)||0;
      if(a>15||b>15){toast('Sets limitados a 15pts!');return;}
      if(a===b){toast(`Set ${s} não pode empatar!`);return;}
      sets.push({a,b}); if(a>b)wA++;else wB++;
    }
    if(!sets.length){toast('Informe pelo menos um set!');return;}
    if(wA===wB){toast('Resultado em sets não pode empatar!');return;}
    jogo.sets=sets;jogo.golA=wA;jogo.golB=wB;
    jogo.winner=wA>wB?jogo.timeA:jogo.timeB;
  } else {
    const eA=document.getElementById('gA_'+id), eB=document.getElementById('gB_'+id);
    if(!eA||!eB||eA.value===''||eB.value===''){toast('Informe o placar!');return;}
    const gA=parseInt(eA.value), gB=parseInt(eB.value);
    if(isNaN(gA)||isNaN(gB)){toast('Placar inválido!');return;}
    const empOk = ctx==='pc';
    if(!empOk&&gA===gB){toast('Mata-mata não pode empatar!');return;}
    jogo.golA=gA;jogo.golB=gB;
    if(gA===gB){jogo.empate=true;jogo.winner=null;}
    else{jogo.empate=false;jogo.winner=gA>gB?jogo.timeA:jogo.timeB;}
  }
  jogo.finished=true;

  if (ctx==='bracket') {
    const nri=ri+1;
    if(nri>=comp.rodadas.length){comp.campeo=jogo.winner;}
    else{
      const nj=comp.rodadas[nri].jogos[Math.floor(ji/2)];
      if(ji%2===0)nj.timeA=jogo.winner;else nj.timeB=jogo.winner;
    }
  } else if (ctx==='pc') {
    recalcPC(comp);
  } else if (ctx==='pcfinal') {
    if(jogo.tipoJogo==='final')comp.campeo=jogo.winner;
  } else if (ctx==='grupo') {
    const grp=comp.grupos[grupo];
    grp.tabela.forEach(r=>{r.v=0;r.d=0;r.pts=0;});
    grp.jogos.forEach(j=>{
      if(!j.finished||!j.winner)return;
      const rW=grp.tabela.find(r=>r.time===j.winner);
      const rL=grp.tabela.find(r=>r.time===(j.winner===j.timeA?j.timeB:j.timeA));
      if(rW){rW.v++;rW.pts++;}if(rL)rL.d++;
    });
    grp.tabela.sort((a,b)=>b.pts-a.pts);
    const dA=comp.grupos.A.jogos.every(j=>j.finished);
    const dB=comp.grupos.B.jogos.every(j=>j.finished);
    if(dA)comp.final.timeA=comp.grupos.A.tabela[0]?.time;
    if(dB)comp.final.timeB=comp.grupos.B.tabela[0]?.time;
  } else if (ctx==='gfinal') {
    comp.campeo=jogo.winner;
  }

  await apiSalvar(false);
  renderView();
  renderAdmin();
  toast('Jogo finalizado! ' + (jogo.winner ? 'Vencedor: '+jogo.winner : 'Empate!'));
}

// ── BRACKET ───────────────────────────────────────────────────────
function htmlBracket(comp) {
  const MH=72,CW=26,CH=62,totR=comp.rodadas.length;
  const totS=comp.rodadas[0].jogos.length*2, altC=totS*MH;
  let h=`<div class="section-card"><div class="section-header"><div class="section-dot"></div><h3>CHAVE – MATA-MATA</h3></div>
    <div class="bracket-container"><div class="bracket-grid">`;
  comp.rodadas.forEach((rod,ri)=>{
    const qtd=rod.jogos.length,sJ=totS/qtd,aG=sJ*MH,ult=ri===totR-1;
    h+=`<div class="bracket-round"><div class="bracket-round-header">${rod.nome}</div>
      <div class="bracket-col-body" style="height:${altC}px;">`;
    rod.jogos.forEach((j,ji)=>{
      if(!j.timeA&&!j.timeB)return;
      const tA=j.timeA||'A DEFINIR',tB=j.timeB||'A DEFINIR';
      const clA=j.finished?(j.winner===j.timeA?'winner':'loser'):(!j.timeA?'tbd':'');
      const clB=j.finished?(j.winner===j.timeB?'winner':'loser'):(!j.timeB?'tbd':'');
      const sA=j.finished?j.golA:(j.timeA?'-':''),sB=j.finished?j.golB:(j.timeB?'-':'');
      const top=ji*aG+(aG/2)-(CH/2);
      let pen='';
      if(j.finished&&j.golA===j.golB&&j.penaltisA!=null)
        pen=`<div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;color:#5A8FA0;text-align:center;padding:1px 0">PEN: ${j.penaltisA}–${j.penaltisB}</div>`;
      let svg='';
      if(!ult){
        const sT=(ji^1)*aG+(aG/2)-(CH/2),mM=top+CH/2,sM=sT+CH/2,jY=(mM+sM)/2;
        const svH=Math.abs(jY-mM)+2,y1=mM<=jY?1:svH-1,y2=mM<=jY?svH-1:1;
        svg=`<svg class="bracket-conn" style="top:${Math.min(mM,jY)-1}px;height:${svH}px;" viewBox="0 0 ${CW} ${svH}" preserveAspectRatio="none">
          <line x1="0" y1="${y1}" x2="0" y2="${y2}" stroke="#1E3F5C" stroke-width="1.5"/>
          <line x1="0" y1="${y2}" x2="${CW}" y2="${y2}" stroke="#1E3F5C" stroke-width="1.5"/>
        </svg>`;
      }
      h+=`<div class="bracket-slot" style="top:${top}px;"><div class="bracket-match">
        <div class="bracket-team ${clA}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;flex:1">${tA}</span><span class="bracket-score ${j.finished?'':'tbd-score'}">${sA}</span></div>
        ${pen}
        <div class="bracket-team ${clB}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;flex:1">${tB}</span><span class="bracket-score ${j.finished?'':'tbd-score'}">${sB}</span></div>
        </div>${svg}</div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div></div></div>`;
  return h;
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function nomesR(n){const r=[];while(n>=1){if(n===1)r.push('FINAL');else if(n===2)r.push('SEMIFINAL');else if(n===4)r.push('QUARTAS DE FINAL');else r.push('OITAVAS DE FINAL');n=Math.floor(n/2);}return r;}

function gerarBracket(times,isV){
  const lista=shuffle(times);
  let tam=1;while(tam<lista.length)tam*=2;
  while(lista.length<tam)lista.push(null);
  const z=()=>({A:{am:0,vm:0,az:0},B:{am:0,vm:0,az:0}});
  const mk=(tA,tB)=>({id:uid(),timeA:tA||null,timeB:tB||null,golA:null,golB:null,finished:false,isBye:false,winner:null,cartoes:z(),isVolei:!!isV,sets:isV?[]:null});
  const r1=[];
  for(let i=0;i<tam;i+=2){
    const j=mk(lista[i],lista[i+1]);
    if(j.timeA&&!j.timeB){j.finished=true;j.winner=j.timeA;j.golA=1;j.golB=0;j.isBye=true;}
    if(!j.timeA&&j.timeB){j.finished=true;j.winner=j.timeB;j.golA=0;j.golB=1;j.isBye=true;}
    r1.push(j);
  }
  const nomes=[{nome:nomesR(tam/2)[0],jogos:r1}];
  let prev=r1;
  for(let r=1;r<Math.log2(tam);r++){
    const cur=[];
    for(let i=0;i<prev.length;i+=2){
      const j=mk(null,null);
      if(prev[i]?.finished)j.timeA=prev[i].winner;
      if(prev[i+1]?.finished)j.timeB=prev[i+1].winner;
      cur.push(j);
    }
    nomes.push({nome:nomesR(tam/2)[r],jogos:cur});
    prev=cur;
  }
  return {tipo:'bracket',rodadas:nomes,campeo:null,isVolei:!!isV};
}

function gerarGrupos(times){
  const emb=shuffle(times),meio=Math.ceil(emb.length/2);
  const gA=emb.slice(0,meio),gB=emb.slice(meio);
  const z=()=>({A:{am:0,vm:0,az:0},B:{am:0,vm:0,az:0}});
  const mk=(tA,tB)=>({id:uid(),timeA:tA,timeB:tB,golA:null,golB:null,finished:false,isBye:false,winner:null,cartoes:z(),isVolei:true,sets:[]});
  const jg=l=>{const a=[];for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++)a.push(mk(l[i],l[j]));return a;};
  const tb=l=>l.map(t=>({time:t,v:0,d:0,pts:0}));
  return {
    tipo:'grupos',
    grupos:{A:{times:gA,jogos:jg(gA),tabela:tb(gA)},B:{times:gB,jogos:jg(gB),tabela:tb(gB)}},
    final:{id:uid(),timeA:null,timeB:null,golA:null,golB:null,finished:false,winner:null,cartoes:z(),isVolei:true,sets:[]},
    campeo:null
  };
}

const NOMES_ABA={futmanha:'Futebol – Manhã',futtarde:'Futebol – Tarde',volmanha:'Vôlei – Manhã',voltarde:'Vôlei – Tarde'};

async function sortearChave(){
  const nome=NOMES_ABA[TA];
  const getC={futmanha:()=>D.futebol.manha,futtarde:()=>D.futebol.tarde,volmanha:()=>D.volei.manha,voltarde:()=>D.volei.tarde};
  if(getC[TA]()&&!window.confirm(`${nome}\n\nJá existe chave gerada.\nSobrescrever e sortear novamente?`))return;
  if(TA==='futmanha')      D.futebol.manha=gerarBracket(TIMES.futebol.manha,false);
  else if(TA==='futtarde') D.futebol.tarde=mkFutTarde();
  else if(TA==='volmanha') D.volei.manha=gerarGrupos(TIMES.volei.manha);
  else if(TA==='voltarde') D.volei.tarde=gerarBracket(TIMES.volei.tarde,true);
  await apiSalvar(false);
  atualizaLabel();
  renderView();
  renderAdmin();
  toast('Chave sorteada: '+nome);
}

function atualizaLabel(){
  const el=document.getElementById('labelChave');

  const ex=!!getC[TA]();
  el.textContent='Selecionada: '+nome+(ex?' (já sorteada)':' (não sorteada)');

function rowAdmin(jogo,empOk){
  if(!jogo.timeA||!jogo.timeB)
    return`<div class="admin-game-row" style="opacity:.3"><p style="font-size:12px;color:#2A5060;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase">Aguardando definição dos times...</p></div>`;
  const id=jogo.id;
  if(jogo.finished){
    const res=jogo.empate?'Empate':`Vencedor: ${jogo.winner}`;
    return`<div class="admin-game-row finished-row">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:13px;color:#3A6A7C;font-weight:600">${jogo.timeA}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:#F5E176">${jogo.golA} – ${jogo.golB}</span>
        <span style="font-size:13px;color:#3A6A7C;font-weight:600">${jogo.timeB}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:#2A7F8F;letter-spacing:1px;text-transform:uppercase;margin-left:auto">${res}</span>
      </div>
    </div>`;
  }
  const cv=(t,k)=>jogo.cartoes?.[t]?.[k]||0;
  let ep='';
  if(jogo.isVolei){
    let si='';
    for(let s=1;s<=3;s++)si+=`<div class="set-row"><span class="set-row-label">SET ${s}</span>
      <input type="number" min="0" max="15" class="set-score-input" id="s${s}a_${id}" placeholder="0">
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#2A5060">–</span>
      <input type="number" min="0" max="15" class="set-score-input" id="s${s}b_${id}" placeholder="0">
    </div>`;
    ep=`<div><div class="form-label" style="margin-bottom:7px">SETS (MÁX 15 PTS)</div>${si}</div>`;
  } else {
    ep=`<div><div class="form-label" style="margin-bottom:3px">${jogo.timeA}</div>
      <input type="number" min="0" class="score-input" id="gA_${id}" placeholder="0"></div>
    <div style="padding-bottom:11px"><span style="font-family:'Barlow Condensed',sans-serif;font-size:19px;color:#2A5060;font-weight:700">–</span></div>
    <div><div class="form-label" style="margin-bottom:3px">${jogo.timeB}</div>
      <input type="number" min="0" class="score-input" id="gB_${id}" placeholder="0"></div>`;
    if(empOk)ep+=`<div style="padding-bottom:11px;align-self:flex-end"><span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:#5A8FA0;letter-spacing:1px;text-transform:uppercase">Empate OK</span></div>`;
  }
  return`<div class="admin-game-row" id="row_${id}">
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px">
      <span style="font-size:13px;color:#E8F4F8;font-weight:700">${jogo.timeA}</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:12px;color:#2A5060;letter-spacing:2px">VS</span>
      <span style="font-size:13px;color:#E8F4F8;font-weight:700">${jogo.timeB}</span>
    </div>
    <div style="display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap">${ep}
      <div style="margin-left:auto;min-width:210px">
        <div class="form-label" style="margin-bottom:7px">CARTÕES – ${jogo.timeA}</div>
        <div style="display:flex;gap:9px;margin-bottom:13px">
          <div class="card-input-group"><input type="number" min="0" class="card-input yi" id="cAY_${id}" value="${cv('A','am')}"><span class="card-input-label" style="color:#FFC800">AM</span></div>
          <div class="card-input-group"><input type="number" min="0" class="card-input ri" id="cAR_${id}" value="${cv('A','vm')}"><span class="card-input-label" style="color:#E05050">VM</span></div>
          <div class="card-input-group"><input type="number" min="0" class="card-input bi" id="cAB_${id}" value="${cv('A','az')}"><span class="card-input-label" style="color:#5096DC">AZ</span></div>
        </div>
        <div class="form-label" style="margin-bottom:7px">CARTÕES – ${jogo.timeB}</div>
        <div style="display:flex;gap:9px">
          <div class="card-input-group"><input type="number" min="0" class="card-input yi" id="cBY_${id}" value="${cv('B','am')}"><span class="card-input-label" style="color:#FFC800">AM</span></div>
          <div class="card-input-group"><input type="number" min="0" class="card-input ri" id="cBR_${id}" value="${cv('B','vm')}"><span class="card-input-label" style="color:#E05050">VM</span></div>
          <div class="card-input-group"><input type="number" min="0" class="card-input bi" id="cBB_${id}" value="${cv('B','az')}"><span class="card-input-label" style="color:#5096DC">AZ</span></div>
        </div>
      </div>
    </div>
    <div style="margin-top:13px;padding-top:13px;border-top:1px solid #1A3040;display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn-primary" onclick="finalizeMatch('${id}')">FINALIZAR JOGO</button>
    </div>
  </div>`;
}

function switchSport(s){SP=s;document.querySelectorAll('.sport-tab').forEach(t=>t.classList.remove('active'));document.getElementById('sportTab_'+s).classList.add('active');renderView();}
function switchShift(t){TR=t;document.querySelectorAll('.shift-tab[id^="shiftTab"]').forEach(x=>x.classList.remove('active'));document.getElementById('shiftTab_'+t).classList.add('active');renderView();}
function openPassModal(){document.getElementById('passModal').style.display='flex';setTimeout(()=>document.getElementById('passInput').focus(),100);}
function closePassModal(){document.getElementById('passModal').style.display='none';document.getElementById('passInput').value='';document.getElementById('passErr').style.display='none';}
function checkPass(){if(document.getElementById('passInput').value==='246800'){closePassModal();clearInterval(pollTmr);document.getElementById('adminPanel').style.display='flex';atualizaLabel();renderAdmin();}else{document.getElementById('passErr').style.display='block';document.getElementById('passInput').value='';document.getElementById('passInput').focus();}}
function closeAdmin(){document.getElementById('adminPanel').style.display='none';startPolling();renderView();}

// ══════════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════════
window.onload = async function() {
  setSync('carregando');

  // Carrega históricos fixos como estado base
  D.futebol.manha = HIST_FM;
  D.futebol.tarde = mkFutTarde();
  try { localStorage.setItem('copa_bkp', JSON.stringify(D)); } catch(e) {}

  // Tenta carregar da nuvem (sobrescreve se houver dados mais recentes)
  await apiCarregar();

  // Garante que os históricos existem caso a nuvem esteja vazia
  if (!D.futebol.manha) D.futebol.manha = HIST_FM;
  if (!D.futebol.tarde) D.futebol.tarde = mkFutTarde();

  // Recompõe tabelas e fase final do Futebol Tarde após carregar da nuvem
  // (necessário porque JSON.parse cria novos objetos sem referências cruzadas)
  if (D.futebol.tarde && D.futebol.tarde.tipo === 'pontoscorridos') {
    // Garante que C1 e C2 existem com a estrutura correcta
    const ft = D.futebol.tarde;
    if (!ft.C1 || !ft.C1.tab) ft.C1 = mkFutTarde().C1;
    if (!ft.C2 || !ft.C2.tab) ft.C2 = mkFutTarde().C2;
    // Garante que terceiro e final existem
    if (!ft.terceiro) ft.terceiro = mkFutTarde().terceiro;
    if (!ft.final)    ft.final    = mkFutTarde().final;
    // Recalcula tabelas a partir dos jogos já finalizados
    recalcPC(ft);
  }

  renderView();
  startPolling();
};
</script>
